<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Card Responsivo</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased flex items-center justify-center p-4">

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 max-w-md md:max-w-2xl w-full">

        <div class="flex flex-col md:flex-row items-center md:items-start gap-6">

            <div class="w-24 h-24 rounded-full bg-slate-300 flex items-center justify-center text-2xl font-bold text-white shrink-0">
                JS
            </div>

            <div class="text-center md:text-left">

                <span class="text-sm text-slate-500">
                    Desenvolvedora Front-end
                </span>

                <h1 class="text-2xl font-bold text-slate-800 mt-1">
                    Amanda Braun
                </h1>

                <p class="text-slate-600 mt-4">
                    "O segredo de uma interface incrível não está nas cores,
                    mas no domínio absoluto do espaçamento e da hierarquia
                    visual."
                </p>

                <button class="mt-6 px-5 py-2 border border-slate-300 rounded-lg transition-colors hover:bg-slate-50">
                    Ver Perfil
                </button>

            </div>

        </div>

    </div>

</body>
</html>
