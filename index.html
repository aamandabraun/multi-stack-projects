<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Aula 3</title>
</head>
<body>
    <header>
        <h1>
            Gerenciador de tarefas
        </h1>
    </header>

    <main>
        <!-- Comentário-->
         <section>
            <h2>Criar Nova Tarefa</h2>
            <form>
                <div>
                    <label for="input-titulo">Título da atividade</label>
                    <input type="text" id="input-titulo" required placeholder="Digite o nome da atividade">
                </div>
                <div>
                    <label for="select-prioridade">Prioridade:</label>
                    <select id="select-prioridade">
                        <option value="low">Baixa</option>
                        <option value="medium">Média</option>
                        <option value="high">Alta</option>
                    </select>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
         </section>

        <!-- Seção da lista de tarefas--> 
         
        <section>
            <h2>Minhas tarefas</h2>
                <div>
                    <input type="checkbox">
                    <h4>Estudar para a prova de Web</h4>
                </div>
        </section>
    </main>

    <footer>
        <p>Desenvolvimento de Sistemas Web</p>
    </footer>
</body>
</html>
